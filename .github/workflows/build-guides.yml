name: Build and Release Guides

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-and-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Validate, Build PDF & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Validate tags, fragments and guides
        run: npm run validate

      - name: Run automated tests
        run: npm test

      - name: Build PDF guides
        run: npm run build

      - name: Update single 'latest' GitHub Release with PDF guides
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          PDF_FILES=(dist/*.pdf)
          if [ ${#PDF_FILES[@]} -eq 0 ]; then
            echo "Errore: nessun file PDF trovato in dist/."
            exit 1
          fi

          DATE_STR=$(date -u +'%Y-%m-%d %H:%M UTC')
          TAG="latest"
          TITLE="Guide PDF (aggiornate al ${DATE_STR})"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi

          gh release create "$TAG" "${PDF_FILES[@]}" \
            --target "${{ github.sha }}" \
            --title "$TITLE" \
            --notes "Guide PDF generate automaticamente dal commit ${{ github.sha }}." \
            --latest
